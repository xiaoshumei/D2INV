<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Metrics Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  :root {
    --primary: #6366f1;
    --primary-light: #818cf8;
    --primary-dark: #4f46e5;
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-hover: #273548;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --border: #334155;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --star-filled: #fbbf24;
    --star-empty: #374151;
    --progress-bg: #334155;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  .header {
    text-align: center;
    margin-bottom: 24px;
    width: 100%;
    max-width: 1200px;
  }

  .header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--primary-light), #a78bfa, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }

  .header p {
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  .dashboard {
    display: flex;
    gap: 24px;
    width: 100%;
    max-width: 1200px;
    height: 520px;
  }

  .chart-panel {
    flex: 1;
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--border);
    padding: 20px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }

  .chart-panel .panel-title {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .chart-panel .panel-title .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 8px var(--primary);
  }

  #radarChart {
    flex: 1;
    width: 100%;
    min-height: 0;
  }

  .controls-panel {
    width: 420px;
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .controls-header {
    padding: 20px 20px 12px;
    border-bottom: 1px solid var(--border);
  }

  .controls-header h3 {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .controls-header h3 .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
  }

  .dimensions-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 20px;
  }

  .dimensions-list::-webkit-scrollbar {
    width: 4px;
  }

  .dimensions-list::-webkit-scrollbar-track {
    background: transparent;
  }

  .dimensions-list::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 2px;
  }

  .dim-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.25s ease;
    margin-bottom: 6px;
    border: 1px solid transparent;
  }

  .dim-item:hover {
    background: var(--surface-hover);
  }

  .dim-item.active {
    background: rgba(99, 102, 241, 0.12);
    border-color: var(--primary);
    box-shadow: 0 0 12px rgba(99, 102, 241, 0.15);
  }

  .dim-label {
    font-size: 0.9rem;
    font-weight: 600;
    min-width: 85px;
    text-transform: capitalize;
  }

  .dim-stars {
    display: flex;
    gap: 3px;
    flex-shrink: 0;
  }

  .dim-stars .star {
    font-size: 14px;
    transition: all 0.2s;
  }

  .dim-stars .star.filled {
    color: var(--star-filled);
    text-shadow: 0 0 4px rgba(251, 191, 36, 0.4);
  }

  .dim-stars .star.empty {
    color: var(--star-empty);
  }

  .dim-stars .star.half {
    position: relative;
    color: var(--star-empty);
  }

  .dim-stars .star.half::before {
    content: '★';
    position: absolute;
    left: 0;
    top: 0;
    color: var(--star-filled);
    overflow: hidden;
    width: 50%;
    text-shadow: 0 0 4px rgba(251, 191, 36, 0.4);
  }

  .dim-progress-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dim-progress-bar {
    flex: 1;
    height: 8px;
    background: var(--progress-bg);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }

  .dim-progress-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
    transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
  }

  .dim-progress-fill::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    animation: shimmer 2s infinite;
  }

  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .dim-value {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--primary-light);
    min-width: 28px;
    text-align: right;
  }

  .detail-panel {
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    background: rgba(99, 102, 241, 0.05);
    transition: all 0.35s ease;
    overflow: hidden;
    max-height: 0;
    opacity: 0;
  }

  .detail-panel.visible {
    max-height: 200px;
    opacity: 1;
  }

  .detail-content {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .detail-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
  }

  .detail-info {
    flex: 1;
  }

  .detail-name {
    font-size: 1rem;
    font-weight: 700;
    text-transform: capitalize;
    margin-bottom: 2px;
  }

  .detail-score {
    font-size: 0.85rem;
    color: var(--primary-light);
    font-weight: 600;
  }

  .detail-score span {
    color: var(--text-muted);
    font-weight: 400;
  }

  .detail-badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .badge-good {
    background: rgba(16, 185, 129, 0.15);
    color: var(--success);
    border: 1px solid rgba(16, 185, 129, 0.3);
  }

  .badge-excellent {
    background: rgba(99, 102, 241, 0.15);
    color: var(--primary-light);
    border: 1px solid rgba(99, 102, 241, 0.3);
  }

  .overall-stats {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 16px;
    justify-content: center;
  }

  .stat-box {
    text-align: center;
    flex: 1;
  }

  .stat-value {
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--primary-light);
  }

  .stat-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  @media (max-width: 900px) {
    .dashboard {
      flex-direction: column;
      height: auto;
    }
    .controls-panel {
      width: 100%;
    }
    .chart-panel {
      min-height: 350px;
    }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📊 Performance Metrics Dashboard</h1>
  <p>Interactive analysis of key evaluation dimensions</p>
</div>

<div class="dashboard">
  <div class="chart-panel">
    <div class="panel-title"><span class="dot"></span>Radar Overview</div>
    <div id="radarChart"></div>
  </div>

  <div class="controls-panel">
    <div class="controls-header">
      <h3><span class="dot"></span>Dimension Controls</h3>
    </div>
    <div class="dimensions-list" id="dimensionsList"></div>
    <div class="detail-panel" id="detailPanel">
      <div class="detail-content">
        <div class="detail-icon" id="detailIcon">📈</div>
        <div class="detail-info">
          <div class="detail-name" id="detailName">—</div>
          <div class="detail-score" id="detailScore">—</div>
        </div>
        <div class="detail-badge" id="detailBadge">—</div>
      </div>
    </div>
    <div class="overall-stats">
      <div class="stat-box">
        <div class="stat-value" id="statAvg">—</div>
        <div class="stat-label">Average</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="statMax">—</div>
        <div class="stat-label">Highest</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="statMin">—</div>
        <div class="stat-label">Lowest</div>
      </div>
    </div>
  </div>
</div>

<script>
const data = {
  engagement: 7,
  usefulness: 8,
  legibility: 8,
  design: 8,
  aesthetics: 8
};

const dimKeys = Object.keys(data);
const icons = {
  engagement: '🤝',
  usefulness: '💡',
  legibility: '👁️',
  design: '🎨',
  aesthetics: '✨'
};

const chart = echarts.init(document.getElementById('radarChart'), null, { renderer: 'canvas' });

const radarOption = {
  backgroundColor: 'transparent',
  tooltip: {
    trigger: 'item',
    backgroundColor: '#1e293b',
    borderColor: '#334155',
    textStyle: { color: '#f8fafc', fontSize: 13 },
    formatter: function(params) {
      const name = params.name.charAt(0).toUpperCase() + params.name.slice(1);
      return `<div style="font-weight:700;margin-bottom:4px">${name}</div>Score: <strong>${params.value}</strong> / 10`;
    }
  },
  radar: {
    indicator: dimKeys.map(k => ({ name: k, max: 10 })),
    shape: 'polygon',
    radius: '65%',
    center: ['50%', '52%'],
    splitNumber: 5,
    axisName: {
      color: '#94a3b8',
      fontSize: 12,
      fontWeight: 600,
      textTransform: 'capitalize'
    },
    splitLine: {
      lineStyle: { color: '#334155', width: 1 }
    },
    splitArea: {
      areaStyle: {
        color: ['rgba(99,102,241,0.02)', 'rgba(99,102,241,0.05)', 'rgba(99,102,241,0.02)', 'rgba(99,102,241,0.05)', 'rgba(99,102,241,0.02)']
      }
    },
    axisLine: { lineStyle: { color: '#334155' } }
  },
  series: [{
    type: 'radar',
    data: [{
      value: dimKeys.map(k => data[k]),
      name: 'Metrics',
      symbol: 'circle',
      symbolSize: 8,
      lineStyle: {
        color: '#818cf8',
        width: 3,
        shadowColor: 'rgba(129,140,248,0.4)',
        shadowBlur: 10
      },
      itemStyle: {
        color: '#818cf8',
        borderColor: '#fff',
        borderWidth: 2,
        shadowColor: 'rgba(129,140,248,0.6)',
        shadowBlur: 8
      },
      areaStyle: {
        color: {
          type: 'radial',
          x: 0.5, y: 0.5, r: 0.6,
          colorStops: [
            { offset: 0, color: 'rgba(99,102,241,0.35)' },
            { offset: 1, color: 'rgba(99,102,241,0.08)' }
          ]
        }
      }
    }]
  }]
};

chart.setOption(radarOption);

function generateStars(score) {
  let html = '';
  const full = Math.floor(score / 2);
  const half = score % 2 === 1;
  const empty = 5 - full - (half ? 1 : 0);
  for (let i = 0; i < full; i++) html += '<span class="star filled">★</span>';
  if (half) html += '<span class="star half">★</span>';
  for (let i = 0; i < empty; i++) html += '<span class="star empty">★</span>';
  return html;
}

function getBadge(score) {
  if (score >= 8) return '<span class="detail-badge badge-excellent">Excellent</span>';
  if (score >= 6) return '<span class="detail-badge badge-good">Good</span>';
  return '<span class="detail-badge badge-warning">Fair</span>';
}

function buildDimensionsList() {
  const container = document.getElementById('dimensionsList');
  container.innerHTML = '';
  dimKeys.forEach((key, idx) => {
    const score = data[key];
    const pct = score * 10;
    const item = document.createElement('div');
    item.className = 'dim-item';
    item.dataset.key = key;
    item.innerHTML = `
      <div class="dim-label">${key}</div>
      <div class="dim-stars">${generateStars(score)}</div>
      <div class="dim-progress-wrap">
        <div class="dim-progress-bar">
          <div class="dim-progress-fill" style="width: 0%"></div>
        </div>
        <div class="dim-value">${score}</div>
      </div>
    `;
    item.addEventListener('click', () => selectDimension(key, item));
    container.appendChild(item);

    setTimeout(() => {
      item.querySelector('.dim-progress-fill').style.width = pct + '%';
    }, 100 + idx * 100);
  });
}

let selectedKey = null;

function selectDimension(key, el) {
  const items = document.querySelectorAll('.dim-item');

  if (selectedKey === key) {
    selectedKey = null;
    items.forEach(it => it.classList.remove('active'));
    document.getElementById('detailPanel').classList.remove('visible');
    chart.dispatchAction({ type: 'downplay', seriesIndex: 0 });
    highlightRadar(null);
    return;
  }

  selectedKey = key;
  items.forEach(it => it.classList.remove('active'));
  el.classList.add('active');

  const score = data[key];
  document.getElementById('detailIcon').textContent = icons[key] || '📈';
  document.getElementById('detailName').textContent = key.charAt(0).toUpperCase() + key.slice(1);
  document.getElementById('detailScore').innerHTML = `Score: <strong>${score}</strong> / 10 <span>| ${Math.round(score / 2) * 2}/10 stars</span>`;
  document.getElementById('detailBadge').outerHTML = getBadge(score);
  document.getElementById('detailPanel').classList.add('visible');

  highlightRadar(key);
}

function highlightRadar(key) {
  const seriesData = chart.getOption().series[0].data[0];
  const newIndicator = dimKeys.map(k => ({
    name: k,
    max: 10,
    ...(key && k === key ? {} : {})
  }));

  if (!key) {
    seriesData.value = dimKeys.map(k => data[k]);
    seriesData.symbolSize = 8;
    chart.setOption({
      series: [{ data: [seriesData] }]
    });
    return;
  }

  const highlightedValue = dimKeys.map(k => {
    if (k === key) return data[k];
    return data[k] * 0.35;
  });

  seriesData.value = highlightedValue;
  chart.setOption({
    series: [{ data: [seriesData] }]
  });
}

function computeStats() {
  const vals = dimKeys.map(k => data[k]);
  const avg = (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1);
  const max = Math.max(...vals);
  const min = Math.min(...vals);
  document.getElementById('statAvg').textContent = avg;
  document.getElementById('statMax').textContent = max;
  document.getElementById('statMin').textContent = min;
}

function animateStats() {
  const vals = dimKeys.map(k => data[k]);
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  const max = Math.max(...vals);
  const min = Math.min(...vals);

  [
    { id: 'statAvg', target: avg.toFixed(1) },
    { id: 'statMax', target: max },
    { id: 'statMin', target: min }
  ].forEach(item => {
    const el = document.getElementById(item.id);
    let current = 0;
    const step = parseFloat(item.target) / 30;
    const interval = setInterval(() => {
      current += step;
      if (current >= parseFloat(item.target)) {
        current = parseFloat(item.target);
        clearInterval(interval);
      }
      el.textContent = Number.isInteger(parseFloat(item.target)) ? Math.round(current) : current.toFixed(1);
    }, 30);
  });
}

buildDimensionsList();
computeStats();
animateStats();

window.addEventListener('resize', () => chart.resize());
</script>

</body>
